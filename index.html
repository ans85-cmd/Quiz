<!DOCTYPE html>
<html lang="de">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das Lebkuchenhaus - Lernquiz</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #ec4899;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #334155;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-container {
            margin-bottom: 1.5rem;
        }

        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-btn {
            background-color: #334155;
            color: var(--text);
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .option-btn:hover:not(:disabled) {
            background-color: #475569;
            transform: translateY(-2px);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .option-btn.correct {
            background-color: var(--success) !important;
            color: white;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        .option-btn.incorrect {
            background-color: var(--error) !important;
            color: white;
            animation: shake 0.4s ease-in-out;
        }

        .next-btn {
            display: none;
            width: 100%;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            transition: opacity 0.2s;
        }

        .next-btn:hover {
            opacity: 0.9;
        }

        .result-container {
            display: none;
            text-align: center;
        }

        .result-score {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 1rem 0;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .result-text {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 1rem;
        }

        .restart-btn {
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lebkuchenhaus-Quiz</h1>
        <div class="subtitle">Teste dein Wissen zum Aufsatz!</div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div id="quizContainer">
            <div class="question-container">
                <div class="question-text" id="questionText">Frage lädt...</div>
                <div class="options-grid" id="optionsGrid">
                    <!-- Buttons werden dynamisch eingefügt -->
                </div>
            </div>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Nächste Frage 🚀</button>
        </div>

        <div class="result-container" id="resultContainer">
            <h2>Quiz beendet! 🎉</h2>
            <div class="result-score" id="resultScore">0/5</div>
            <div class="result-text" id="resultText">Super gemacht!</div>
            <button class="restart-btn" onclick="restartQuiz()">Nochmal spielen 🔄️</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Wie wird das Wort „lebekuchen haus“ richtig geschrieben?",
                options: [
                    "Lebkuchenhaus",
                    "Lebäkuchendose",
                    "Lebe Kuchen Haus"
                ],
                correct: 0
            },
            {
                question: "Wie lautet die richtige Rechtschreibung für das Wort „herlichen“?",
                options: [
                    "herrlich",
                    "herrlichen",
                    "herlich"
                ],
                correct: 1
            },
            {
                question: "Was machten Hans und Gretl, nachdem die Hexe im Ofen war?",
                options: [
                    "Sie gingen sofort schlafen.",
                    "Sie tanzten glücklich im Wald und aßen Lebkuchen.",
                    "Sie suchten nach ihren Schuhen."
                ],
                correct: 1
            },
            {
                question: "Wie schreibt man das Wort „wahren“ (in: „...dass die beiden entkommen waren“) richtig?",
                options: [
                    "wahren (mit h)",
                    "waren (ohne h)",
                    "wahrn"
                ],
                correct: 1
            },
            {
                question: "Welches Wort wird mit Doppel-s („dass“) geschrieben?",
                options: [
                    "Das Mädchen sah, _ die Dame am Ofen war.",
                    "Das ist _ Haus.",
                    "Gib mir _ Buch."
                ],
                correct: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById("questionText");
        const optionsGrid = document.getElementById("optionsGrid");
        const nextBtn = document.getElementById("nextBtn");
        const progressFill = document.getElementById("progressFill");
        const quizContainer = document.getElementById("quizContainer");
        const resultContainer = document.getElementById("resultContainer");
        const resultScore = document.getElementById("resultScore");
        const resultText = document.getElementById("resultText");

        function loadQuestion() {
            answered = false;
            nextBtn.style.display = "none";
            
            const currentData = quizData[currentQuestionIndex];
            questionText.innerText = `${currentQuestionIndex + 1}. ${currentData.question}`;
            
            optionsGrid.innerHTML = "";
            currentData.options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.classList.add("option-btn");
                btn.innerText = option;
                btn.onclick = () => selectOption(index, btn);
                optionsGrid.appendChild(btn);
            });

            updateProgress();
        }

        function selectOption(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const currentData = quizData[currentQuestionIndex];
            const allButtons = optionsGrid.children;

            if (selectedIndex === currentData.correct) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("incorrect");
                allButtons[currentData.correct].classList.add("correct");
            }

            // Alle Buttons deaktivieren
            for (let btn of allButtons) {
                btn.disabled = true;
            }

            // Nächste-Frage-Button anzeigen oder bei letzter Frage auf Auswertung wechseln
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtn.style.display = "block";
            } else {
                nextBtn.innerText = "Zur Auswertung 🏆";
                nextBtn.style.display = "block";
            }
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex) / quizData.length) * 100;
            progressFill.style.width = `${progress}%`;
        }

        function showResult() {
            quizContainer.style.display = "none";
            progressFill.style.width = "100%";
            resultContainer.style.display = "block";
            
            resultScore.innerText = `${score} / ${quizData.length}`;

            if (score === quizData.length) {
                resultText.innerText = "Wahnsinn! Du bist ein echter Rechtschreib-Profi! 🌟";
            } else if (score >= 3) {
                resultText.innerText = "Super gemacht! Da waren schon echte Meisterleistungen dabei! 👍";
            } else {
                resultText.innerText = "Das üben wir noch ein bisschen, du packst das! 💪";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultContainer.style.display = "none";
            quizContainer.style.display = "block";
            loadQuestion();
        }

        // Start beim Laden
        loadQuestion();
    </script>
</body>
</html>
