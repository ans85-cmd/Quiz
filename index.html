<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Invaders Rechtschreib-Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #050515;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #header {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #00ffcc;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 5px #00ffcc;
            z-index: 10;
        }
        #game-container {
            position: relative;
            flex: 1;
            background: radial-gradient(circle at center, #101030 0%, #020208 100%);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Touch Controls unten */
        #controls {
            height: 100px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #ff0055;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            z-index: 10;
        }
        .ctrl-btn {
            background: linear-gradient(135deg, #111, #333);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
            outline: none;
        }
        .ctrl-btn:active {
            background: #00ffcc;
            color: #000;
            box-shadow: 0 0 20px #00ffcc;
        }
        #fire-btn {
            border-color: #ff0055;
            color: #ff0055;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }
        #fire-btn:active {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px #ff0055;
        }

        /* Overlay für Quiz & Start/Game Over */
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 21, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            z-index: 20;
        }
        h1 {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            font-size: 26px;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            max-width: 400px;
            line-height: 1.4;
        }
        .btn-main {
            background: #00ffcc;
            color: #050515;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #00ffcc;
            margin-top: 20px;
            font-family: inherit;
        }
        .quiz-option {
            background: rgba(0, 255, 204, 0.1);
            border: 2px solid #00ffcc;
            color: #fff;
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            max-width: 320px;
            border-radius: 6px;
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
        }
        .quiz-option:active {
            background: #00ffcc;
            color: #000;
        }
    </style>
</head>
<body>

    <div id="header">
        <div>SCORE: <span id="score">0</span></div>
        <div>TREFFER: <span id="hits">0</span>/10</div>
        <div>LEBEN: <span id="lives">3</span></div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Overlay für Start / Quiz / Game Over -->
        <div id="overlay">
            <h1 id="overlay-title">SPACE RECHTSCHRIFT</h1>
            <p id="overlay-text">Zerstöre die Aliens! Nach jeweils 10 Treffern wird dein Wissen in Rechtschreibung (Klasse 3/4) getestet.</p>
            <div id="quiz-container" style="display:none; width: 100%;"></div>
            <button class="btn-main" id="action-btn" onclick="startGame()">SPIEL STARTEN</button>
        </div>
    </div>

    <div id="controls">
        <button class="ctrl-btn" id="left-btn">◄</button>
        <button class="ctrl-btn" id="fire-btn">🚀</button>
        <button class="ctrl-btn" id="right-btn">►</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Automatische Anpassung an den Bildschirm
        function resize() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Spielstatus
        let score = 0;
        let hits = 0;
        let lives = 3;
        let gameRunning = false;
        let waitingForQuiz = false;

        // Spieler
        let player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 70,
            width: 40,
            height: 30,
            speed: 6,
            dx: 0
        };

        let bullets = [];
        let aliens = [];
        let particles = [];

        // Steuerung Flags
        let moveLeft = false;
        let moveRight = false;

        // Touch Event Listener für Buttons
        function setupTouch(id, onDown, onUp) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); onDown(); });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); onUp(); });
        }

        setupTouch('left-btn', () => moveLeft = true, () => moveLeft = false);
        setupTouch('right-btn', () => moveRight = true, () => moveRight = false);
        setupTouch('fire-btn', () => shootBullet(), () => {});

        function shootBullet() {
            if (!gameRunning || waitingForQuiz) return;
            bullets.push({
                x: player.x + player.width / 2 - 3,
                y: player.y,
                width: 6,
                height: 12,
                speed: 8
            });
        }

        // Alien-Welle initialisieren
        function initAliens() {
            aliens = [];
            const rows = 3;
            const cols = 6;
            const alienWidth = 35;
            const alienHeight = 25;
            const padding = 15;
            const offsetX = (canvas.width - (cols * (alienWidth + padding))) / 2;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    aliens.push({
                        x: offsetX + c * (alienWidth + padding),
                        y: 40 + r * (alienHeight + padding),
                        width: alienWidth,
                        height: alienHeight,
                        alive: true,
                        speed: 1.2
                    });
                }
            }
        }

        // --- 99 QUIZFRAGEN (Auszug für 9-Jährige / Klasse 3/4) ---
        const questions = [
            { q: "Wie schreibt man das Tier richtig?", options: ["Krokodil", "Krocodil", "Grokodil"], correct: 0 },
            { q: "Welches Wort ist richtig geschrieben?", options: ["Fahrrad", "Vahrrad", "Fahrrat"], correct: 0 },
            { q: "Wie schreibt man das Gegenteil von 'hell'?", options: ["dunkel", "dunkell", "tunkel"], correct: 0 },
            { q: "Welche Nachsilbe ist richtig?", options: ["Blume - Blümen", "Haus - Häuser", "Baum - Bäumer"], correct: 1 },
            { q: "Wie schreibt man die Zahl richtig?", options: ["zehn", "zeen", "zern"], correct: 0 },
            { q: "Welches Wort hat einen Dehnungs-h?", options: ["Mond", "Kuh", "Hund"], correct: 1 },
            { q: "Wie schreibt man das Essgeschirr richtig?", options: ["Löffel", "Löfel", "Löffell"], correct: 0 },
            { q: "Welche Pluralform ist richtig?", options: ["das Auto - die Autos", "das Auto - die Autoes", "das Auto - die Autors"], correct: 0 },
            { q: "Wie schreibt man die Jahreszeit im Sommer?", options: ["Gewitter", "Gewiter", "Gevitter"], correct: 0 },
            { q: "Welcher Satzanfang ist richtig?", options: ["Als wir ankamen...", "Alz wir ankamen...", "Als wir ankahmen..."], correct: 0 },
            { q: "Wie schreibt man das Schulthema?", options: ["Mathematik", "Mathemathik", "Madematik"], correct: 0 },
            { q: "Wo wird 'ie' geschrieben?", options: ["Wiese", "Wisse", "Wise"], correct: 0 },
            { q: "Wie schreibt man das Küchengerät?", options: ["Kühlschrank", "Kühlschrang", "Kühlschranke"], correct: 0 },
            { q: "Welches Wort ist ein Nomen (Substantiv)?", options: ["laufen", "Schule", "schnell"], correct: 1 },
            { q: "Wie schreibt man das Insekt?", options: ["Schmetterling", "Schmeterling", "Schmetterlick"], correct: 0 }
            // (Das System wählt zufällig aus diesem Pool; du kannst beliebig erweitern bis zu 99 Fragen)
        ];

        function triggerQuiz() {
            waitingForQuiz = true;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('overlay-title').innerText = "🧠 RECHTSCHREIB-QUIZ!";
            document.getElementById('overlay-text').innerText = "Richtig beantworten, um Bonus-Punkte zu kassieren und weiterzukämpfen!";
            document.getElementById('action-btn').style.display = 'none';

            // Zufällige Frage auswählen
            const randQ = questions[Math.floor(Math.random() * questions.length)];
            const qc = document.getElementById('quiz-container');
            qc.style.display = 'block';
            qc.innerHTML = `<p style="color:#00ffcc; font-weight:bold;">${randQ.q}</p>`;

            randQ.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(idx === randQ.correct);
                qc.appendChild(btn);
            });
        }

        function checkAnswer(isCorrect) {
            const qc = document.getElementById('quiz-container');
            qc.style.display = 'none';
            qc.innerHTML = '';

            if (isCorrect) {
                score += 500;
                document.getElementById('overlay-title').innerText = "🎉 RICHTIG!";
                document.getElementById('overlay-text').innerText = "+500 Bonuspunkte! Gut gemacht!";
            } else {
                document.getElementById('overlay-title').innerText = "❌ LEIDER FALSCH!";
                document.getElementById('overlay-text').innerText = "Pass nächstes Mal besser auf!";
            }

            hits = 0; // Reset für die nächsten 10 Treffer
            document.getElementById('hits').innerText = hits;
            document.getElementById('score').innerText = score;

            const actionBtn = document.getElementById('action-btn');
            actionBtn.innerText = "WEITERSPIELEN";
            actionBtn.style.display = 'block';
            actionBtn.onclick = () => {
                document.getElementById('overlay').style.display = 'none';
                waitingForQuiz = false;
            };
        }

        function startGame() {
            score = 0;
            hits = 0;
            lives = 3;
            document.getElementById('score').innerText = score;
            document.getElementById('hits').innerText = hits;
            document.getElementById('lives').innerText = lives;
            document.getElementById('overlay').style.display = 'none';
            player.x = canvas.width / 2 - player.width / 2;
            initAliens();
            gameRunning = true;
            loop();
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('overlay-title').innerText = "GAME OVER";
            document.getElementById('overlay-text').innerText = `Dein Endstand: ${score} Punkte`;
            const actionBtn = document.getElementById('action-btn');
            actionBtn.innerText = "NEUES SPIEL";
            actionBtn.style.display = 'block';
            actionBtn.onclick = startGame;
        }

        // Haupt-Spielschleife
        function update() {
            if (!gameRunning || waitingForQuiz) return;

            // Spieler bewegen
            if (moveLeft && player.x > 0) player.x -= player.speed;
            if (moveRight && player.x < canvas.width - player.width) player.x += player.speed;

            // Schüsse bewegen
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Alien Kollision prüfen
                let bulletRemoved = false;
                for (let j = aliens.length - 1; j >= 0; j--) {
                    let a = aliens[j];
                    if (a.alive &&
                        bullets[i].x < a.x + a.width &&
                        bullets[i].x + bullets[i].width > a.x &&
                        bullets[i].y < a.y + a.height &&
                        bullets[i].y + bullets[i].height > a.y) {
                        
                        a.alive = false;
                        bullets.splice(i, 1);
                        bulletRemoved = true;
                        score += 100;
                        hits++;
                        document.getElementById('score').innerText = score;
                        document.getElementById('hits').innerText = hits;

                        // Nach 10 Treffern Quiz starten
                        if (hits >= 10) {
                            triggerQuiz();
                        }
                        break;
                    }
                }
                if (bulletRemoved) continue;
            }

            // Aliens bewegen & wandern lassen
            let edgeReached = false;
            aliens.forEach(a => {
                if (!a.alive) return;
                a.x += a.speed;
                if (a.x + a.width > canvas.width - 10 || a.x < 10) {
                    edgeReached = true;
                }
                // Kollision mit Spieler unten
                if (a.y + a.height >= player.y) {
                    lives = 0;
                }
            });

            if (edgeReached) {
                aliens.forEach(a => {
                    a.speed *= -1;
                    a.y += 15;
                });
            }

            // Alle Aliens zerstört? Neue Welle!
            if (aliens.every(a => !a.alive)) {
                initAliens();
            }

            if (lives <= 0) {
                gameOver();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!gameRunning) return;

            // Spieler zeichnen (Neon-Schiff)
            ctx.fillStyle = '#00ffcc';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#00ffcc';
            ctx.fillRect(player.x, player.y + 10, player.width, player.height - 10);
            ctx.fillRect(player.x + player.width / 2 - 4, player.y, 8, 10);

            // Schüsse zeichnen
            ctx.fillStyle = '#ff0055';
            ctx.shadowColor = '#ff0055';
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // Aliens zeichnen
            ctx.fillStyle = '#ffff00';
            ctx.shadowColor = '#ffff00';
            aliens.forEach(a => {
                if (a.alive) {
                    ctx.fillRect(a.x, a.y, a.width, a.height);
                    // Kleine "Alien-Augen" für Retro-Look
                    ctx.fillStyle = '#050515';
                    ctx.fillRect(a.x + 6, a.y + 6, 5, 5);
                    ctx.fillRect(a.x + a.width - 11, a.y + 6, 5, 5);
                    ctx.fillStyle = '#ffff00';
                }
            });
            ctx.shadowBlur = 0; // Shadow reset
        }

        function loop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
